# Runs the same checks as a local `uv run ...` on every pull request and push,
# on the three operating systems the team uses.
name: CI

on:
  pull_request:
    branches: [testing, main]
  push:
    branches: [testing, main]

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint (PEP 8)
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  require-testing-base:
    name: require-testing-base
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from testing
        run: |
          if [ "${{ github.head_ref }}" != "testing" ]; then
            echo "Error: PRs into main must come from testing (got ${{ github.head_ref }})."
            exit 1
          fi
