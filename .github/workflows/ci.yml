# Runs the same checks as a local `uv run ...` on every pull request and push,
# on the three operating systems the team uses.
name: CI

on:
  pull_request:
    branches: [testing, main]
  push:
    branches: [testing, main]

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint (PEP 8)
        run: uv run ruff check .
      - name: Style check (pycodestyle)
        run: uv run python -m pycodestyle main.py src tests
      - name: Formatting
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
